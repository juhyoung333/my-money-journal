<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 자산 플래너 - 실시간 클라우드 동기화 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #F8FAFC;
    --bg-card: #FFFFFF;
    --bg-subtle: #F1F5F9;
    --bg-elevated: #FFFFFF;
    
    --ink-primary: #0F172A;
    --ink-secondary: #475569;
    --ink-muted: #94A3B8;
    
    --border-subtle: #E2E8F0;
    --border-strong: #CBD5E1;
    
    --brand: #E11D48;
    --brand-soft: #FFE4E6;
    
    --emerald: #059669;
    --emerald-soft: #D1FAE5;
    --emerald-border: #A7F3D0;
    
    --amber: #D97706;
    --amber-soft: #FEF3C7;
    --amber-border: #FDE68A;
    
    --rose: #E11D48;
    --rose-soft: #FFE4E6;
    
    --indigo: #4F46E5;
    --indigo-soft: #E0E7FF;

    --gold-highlight: #FEF9C3;
    --sheet-green: #22C55E;
    --sheet-cyan: #06B6D4;
    --sheet-yellow: #FEF08A;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--ink-primary);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif { font-family: 'Noto Serif KR', serif; }
  
  #app {
    max-width: 1440px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }

  /* Header */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    background: #0F172A;
    padding: 16px 24px;
    border-radius: var(--radius-lg);
    color: #fff;
    box-shadow: var(--shadow-md);
    flex-wrap: wrap;
    gap: 12px;
  }
  header.top h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  header.top .sync-badge {
    font-size: 11.5px;
    color: #E2E8F0;
    background: rgba(255,255,255,0.1);
    padding: 6px 12px;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  header.top .sync-badge:hover {
    background: rgba(255,255,255,0.18);
  }
  header.top .sync-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 8px #10B981;
  }

  /* Event Notice Banner */
  .event-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #FFFBEB;
    border: 1px solid var(--amber-border);
    color: #B45309;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .event-banner .badge {
    background: var(--amber);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--radius-full);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Tabs */
  nav.tabs {
    display: flex;
    gap: 6px;
    background: #E2E8F0;
    padding: 4px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  nav.tabs button {
    flex: 1;
    min-width: 90px;
    background: none;
    border: none;
    padding: 9px 13px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  nav.tabs button:hover { color: var(--ink-primary); }
  nav.tabs button.active {
    background: var(--bg-card);
    color: var(--ink-primary);
    box-shadow: var(--shadow-sm);
  }

  /* Card and Layout */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    align-items: start;
  }
  .card-grid .full { grid-column: 1 / -1; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .summary-grid .box {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .summary-grid .box .lbl {
    font-size: 11.5px;
    color: var(--ink-muted);
    font-weight: 500;
  }
  .summary-grid .box .val {
    font-size: 17px;
    font-weight: 700;
    margin-top: 4px;
    letter-spacing: -0.02em;
  }

  /* Tables */
  table.budget {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px;
  }
  table.budget th {
    text-align: left;
    font-weight: 600;
    color: var(--ink-secondary);
    font-size: 11.5px;
    padding: 9px 8px;
    background: var(--bg-subtle);
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
  }
  table.budget th:first-child { border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
  table.budget th:last-child { border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }
  table.budget td {
    padding: 8px;
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: top;
  }
  table.budget td.num { text-align: right; }

  tr.yellow-highlight td {
    background-color: var(--gold-highlight) !important;
    font-weight: 700;
  }

  /* Sheet Specific Row Styles */
  tr.sheet-income-sum td {
    background-color: #DCFCE7 !important;
    color: #14532D !important;
    font-weight: 700;
    border-top: 2px solid #86EFAC;
    border-bottom: 2px solid #86EFAC;
  }
  tr.sheet-expense-sum td {
    background-color: #CFFAFE !important;
    color: #164E63 !important;
    font-weight: 700;
    border-top: 2px solid #67E8F9;
    border-bottom: 2px solid #67E8F9;
  }
  tr.sheet-net-row td {
    background-color: #F8FAFC !important;
    font-weight: 700;
  }
  tr.sheet-investable-row td {
    background-color: var(--sheet-yellow) !important;
    color: #713F12 !important;
    font-weight: 800;
    font-size: 12.5px;
    border-top: 2px solid #FACC15;
    border-bottom: 2px solid #FACC15;
  }

  .crisis-th {
    background: linear-gradient(180deg, #FEF3C7 0%, #FFFFFF 100%) !important;
    border-top: 2px solid var(--amber) !important;
  }
  .crisis-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--amber);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: var(--radius-full);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .crisis-cell {
    background: #FFFBEB !important;
    font-weight: 700 !important;
    color: var(--amber) !important;
  }

  .vision-thumb-wrap {
    margin-top: 5px;
    display: block;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    background: #000;
    max-height: 70px;
  }
  .vision-thumb {
    width: 100%;
    height: 70px;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  .vision-thumb:hover { transform: scale(1.05); }

  .diff-over { color: var(--rose); font-weight: 700; }
  .diff-under { color: var(--emerald); font-weight: 700; }
  .bar-bg { background: var(--border-subtle); border-radius: var(--radius-full); height: 5px; overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; background: var(--emerald); border-radius: var(--radius-full); }
  .bar-fill.over { background: var(--rose); }

  /* Inputs and controls */
  input, select, textarea {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--ink-primary);
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px var(--indigo-soft);
  }
  textarea.autogrow {
    resize: none;
    overflow: hidden;
    min-height: 48px;
    line-height: 1.45;
  }
  textarea.feedback {
    width: 100%;
    resize: none;
    overflow: hidden;
    min-height: 52px;
    line-height: 1.5;
  }
  label.flabel {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-secondary);
    display: block;
    margin: 8px 0 4px;
  }

  .rtabbtn {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink-secondary);
    transition: all 0.15s ease;
  }
  .rtabbtn:hover { color: var(--ink-primary); border-color: var(--border-strong); }
  .rtabbtn.active {
    background: var(--ink-primary);
    color: #fff;
    border-color: var(--ink-primary);
  }

  .scrolltable {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
  }
  .scrolltable table { min-width: 820px; }

  .weekbar, .monthnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .weekbar button, .monthnav button {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weeklabel, .monthnav .m {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .daysrow {
    display: grid;
    grid-template-columns: repeat(7, minmax(130px, 1fr));
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .daycard {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 10px;
    box-shadow: var(--shadow-sm);
  }
  .daycard.today {
    border-color: var(--emerald);
    box-shadow: 0 0 0 1px var(--emerald);
  }
  .daycard .dhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .daycard .dname { font-size: 12px; font-weight: 700; }
  .daycard .ddate { font-size: 10.5px; color: var(--ink-muted); }

  .entry {
    border-bottom: 1px dashed var(--border-subtle);
    padding: 5px 0;
    font-size: 11.5px;
    position: relative;
  }
  .entry .cat {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: var(--radius-full);
    background: var(--emerald-soft);
    color: var(--emerald);
    margin-bottom: 3px;
  }
  .entry .cat.income { background: var(--amber-soft); color: var(--amber); }
  .entry .cat.saving { background: var(--indigo-soft); color: var(--indigo); }
  .entry .amt { font-weight: 700; }
  .entry .actions { position: absolute; right: 0; top: 3px; display: flex; gap: 4px; }
  .entry .edit, .entry .del { color: var(--ink-muted); cursor: pointer; font-size: 10.5px; border: none; background: none; padding: 0 2px; }
  .entry .edit:hover { color: var(--ink-primary); }
  .entry .del:hover { color: var(--rose); }

  .addbtn {
    width: 100%;
    margin-top: 8px;
    padding: 6px;
    font-size: 11px;
    border: 1px dashed var(--border-strong);
    background: none;
    border-radius: var(--radius-sm);
    color: var(--ink-secondary);
    cursor: pointer;
  }
  .addbtn:hover { background: var(--bg-subtle); }
  .daytotal { margin-top: 6px; font-size: 11px; text-align: right; font-weight: 600; color: var(--ink-secondary); }

  .catlist { display: flex; flex-direction: column; gap: 6px; }
  .catrow {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font-size: 12.5px;
    background: #fff;
    flex-wrap: wrap;
  }
  .catrow .tag {
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: var(--radius-full);
    background: var(--emerald-soft);
    color: var(--emerald);
    flex-shrink: 0;
  }
  .catrow .tag.income { background: var(--amber-soft); color: var(--amber); }
  .catrow .tag.saving { background: var(--indigo-soft); color: var(--indigo); }
  .catrow .tag.fixed { background: var(--indigo-soft); color: var(--indigo); }
  .catrow .tag.variable { background: var(--emerald-soft); color: var(--emerald); }
  .catrow .nm { flex: 1; min-width: 110px; font-weight: 600; }
  .catrow input {
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11.5px;
    text-align: right;
  }
  .grouplabel {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-secondary);
    margin: 14px 0 6px;
  }

  .asset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    border-bottom: 1px solid var(--border-subtle);
    padding: 8px 4px;
  }
  .asset-row .nm { flex: 1; font-weight: 500; }
  .asset-row .diff {
    width: auto;
    min-width: 80px;
    text-align: right;
    font-weight: 600;
    font-size: 11.5px;
  }
  .asset-subtotal {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 6px;
    background: var(--bg-subtle);
    border-radius: var(--radius-sm);
    margin-top: 4px;
  }

  /* Calendar */
  .calhead { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11.5px; color: var(--ink-muted); margin-bottom: 6px; font-weight: 600; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calday { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); min-height: 60px; padding: 4px; font-size: 9.5px; }
  .calday.blank { background: none; border: none; }
  .calday .dnum { font-size: 10px; color: var(--ink-muted); text-align: right; font-weight: 600; }
  .projchip {
    background: var(--emerald-soft);
    color: var(--emerald);
    border-radius: 4px;
    padding: 2px 4px;
    margin-top: 3px;
    font-size: 9px;
    font-weight: 600;
    line-height: 1.2;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .projchip.received { background: var(--emerald); color: #fff; }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal {
    background: var(--bg-card);
    width: 100%;
    max-width: 440px;
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    box-shadow: var(--shadow-lg);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal .row { margin-bottom: 10px; }
  .modal select, .modal input { width: 100%; }
  .modal .actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal button.primary {
    flex: 1;
    background: var(--ink-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal button.cancel {
    background: none;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
  }

  /* Toast Notification */
  #toastContainer {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #0F172A;
    color: #FFFFFF;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: auto;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-left: 4px solid var(--emerald); }
  .toast.error { border-left: 4px solid var(--rose); }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:80px 0;color:var(--ink-muted);">클라우드 동기화 연결 중…</div></div>
<div id="toastContainer"></div>

<script type="module">

const DEFAULT_ASSET_ITEMS = [

  {name:'국내주식', group:'invest'},

const DEFAULT_CATS = [

function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function won(n){ return (Math.round(n||0)).toLocaleString('ko-KR') + '원'; }
function bigWon(n){
  n = Math.round(n||0);
  const neg = n<0; n = Math.abs(n);
  const eok = Math.floor(n/100000000);
  const man = Math.floor((n%100000000)/10000);
  let parts = [];
  if(eok>0) parts.push(eok.toLocaleString('ko-KR')+'억');
  if(man>0) parts.push(man.toLocaleString('ko-KR')+'만');
  if(parts.length===0) return (neg?'-':'') + n.toLocaleString('ko-KR') + '원';
  return (neg?'-':'') + parts.join(' ') + '원';
}
function manwon(n){ return Math.round((n||0)/10000*10)/10 + '만'; }
function eokwonAxis(n){ return (Math.round((n||0)/100000000*10)/10) + '억'; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function monKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function parseWon(v){ return parseInt(String(v==null?'':v).replace(/,/g,''))||0; }
function parseWonFloat(v){ return parseFloat(String(v==null?'':v).replace(/,/g,''))||0; }
function formatMoneyInputValue(v){
  const digits = String(v==null?'':v).replace(/[^0-9]/g,'');
  if(!digits) return '';
  return parseInt(digits,10).toLocaleString('en-US');
}

function categoryDonutChart(rangeEntries, type, title){
  const cats = (data.categories || []).filter(c=>c.type===type);
  const rows = cats.map(c=>({
    name: c.name,
    value: (rangeEntries || []).filter(e=>e.categoryId===c.id).reduce((s,e)=>s+e.amount,0)
  })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const total = rows.reduce((s,x)=>s+x.value,0);
  if(total<=0){
    return `<div class="card full">
      <h3 class="serif" style="margin:0 0 4px;font-size:14px;">${title}</h3>
      <div style="text-align:center;padding:16px 10px;color:var(--ink-muted);font-size:12px;">아직 지출 기록이 없습니다.</div>
    </div>`;
  }
  const size=140, r=54, thickness=18;
  const circumference = 2*Math.PI*r;
  let offset = 0;
  const segs = rows.map((row,i)=>{
    const frac = row.value/total;
    const len = frac*circumference;
    const seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${DONUT_PALETTE[i%DONUT_PALETTE.length]}" stroke-width="${thickness}" stroke-dasharray="${len.toFixed(2)} ${(circumference-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += len;
    return seg;
  }).join('');
  const top = rows[0];
  const legend = rows.map((row,i)=>{
    const pct = Math.round(row.value/total*100);
    return `<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;min-width:0;">
      <span style="width:8px;height:8px;border-radius:50%;background:${DONUT_PALETTE[i%DONUT_PALETTE.length]};flex-shrink:0;"></span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(row.name)}</span>
      <span style="color:var(--ink-muted);flex-shrink:0;">${pct}%</span>
      <span style="font-weight:700;flex-shrink:0;min-width:70px;text-align:right;">${won(row.value)}</span>
    </div>`;
  }).join('');
  return `
    <div class="card full">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 class="serif" style="margin:0;font-size:14px;">${title}</h3>
        <span style="font-size:11px;color:var(--ink-muted);">최다 지출: <b style="color:var(--ink-primary);">${escapeHtml(top.name)}</b> (${Math.round(top.value/total*100)}%)</span>
      </div>
      <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">
          ${segs}
          <text x="${size/2}" y="${size/2-3}" text-anchor="middle" font-size="10" fill="var(--ink-muted)">총 지출</text>
          <text x="${size/2}" y="${size/2+14}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-primary)">${manwon(total)}</text>
        </svg>
        <div style="flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 16px;">
          ${legend}
        </div>
      </div>
    </div>
  `;
}

async function save(){
  try {
    localStorage.setItem('my_asset_planner_data_' + currentSyncKey, JSON.stringify(data));
  } catch(e) {}
  if(!currentUser || !db) return false;
  try{
    const syncDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'journals', currentSyncKey);
    await setDoc(syncDocRef, {
      payload: JSON.stringify(data),
      updatedAt: Date.now(),
      updatedBy: currentUser.uid
    });
    return true;
  }catch(err){
    console.error('Firestore save failed:', err);
    return false;
  }
}

function setupRealtimeSync(){
  if(!currentUser || !db) {
    applyMigrationsAndDefaults();
    render();
    return;
  }
  if(syncDocUnsub) { syncDocUnsub(); syncDocUnsub = null; }

  const syncDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'journals', currentSyncKey);
  syncDocUnsub = onSnapshot(syncDocRef, (snap)=>{
    if(snap.metadata && snap.metadata.hasPendingWrites) {
      return;
    }
    if(snap.exists()){
      const r = snap.data();
      if(r && r.payload){
        try{
          data = JSON.parse(r.payload);
          applyMigrationsAndDefaults();
          render();
          showToast('기기 실시간 동기화 완료');
        }catch(e){
          console.error('Payload parse error:', e);
        }
      }
    } else {
      applyMigrationsAndDefaults();
      save();
      render();
    }
  }, (err)=>{
    console.error('onSnapshot error:', err);
    applyMigrationsAndDefaults();
    render();
  });
}

function getWeekRange(d){
  const day = (d.getDay()+6)%7;
  const mon = new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {mon, sun};
}
function weekKey(mon){ return isoDate(mon); }
function monthBounds(d){
  const start = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const end = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
  return {start, end};
}
function catById(id){ return (data.categories || []).find(c=>c.id===id); }
function entriesInRange(startISO, endISO){ return (data.entries || []).filter(e=> e.date >= startISO && e.date <= endISO); }

function getProjectMonthlyInterest(p){
  const principal = p.principal || 0;
  const rate = p.rate1 || 0.05;
  return Math.round((principal * rate) / 12);
}

function getReceivedProjectInterestForMonth(year, month){
  const mk = year + '-' + String(month).padStart(2, '0');
  const receipts = data.projectReceipts?.[mk] || {};
  let total = 0;
  const items = [];
  (data.projects || []).forEach(p=>{
    if(receipts[p.id]?.received){
      const amt = receipts[p.id]?.customAmount != null ? receipts[p.id].customAmount : getProjectMonthlyInterest(p);
      total += amt;
      items.push({ project: p, amount: amt });
    }
  });
  return { total, items };
}

function getReceivedProjectInterestForRange(startISO, endISO){
  // Check projects whose pay day falls into the date range and is marked as received in its month
  let total = 0;
  const items = [];
  (data.projects || []).forEach(p=>{
    if(!p.startDate) return;
    const pDate = new Date(p.startDate + 'T00:00:00');
    const day = pDate.getDate();
    // Scan all days in range to see if any matches project pay day
    const cur = new Date(startISO + 'T00:00:00');
    const end = new Date(endISO + 'T00:00:00');
    while(cur <= end){
      if(cur.getDate() === day){
        const mk = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2, '0');
        if(data.projectReceipts?.[mk]?.[p.id]?.received){
          const amt = data.projectReceipts[mk][p.id].customAmount != null ? data.projectReceipts[mk][p.id].customAmount : getProjectMonthlyInterest(p);
          total += amt;
          items.push({ project: p, date: isoDate(cur), amount: amt });
        }
      }
      cur.setDate(cur.getDate() + 1);
    }
  });
  return { total, items };
}

function getProjectStats(p){
  const principal = p.principal || 0;
  const rawRate = p.rate1 != null && p.rate1 !== '' ? parseFloat(p.rate1) : 0.05;
  const rate = rawRate > 1 ? rawRate / 100 : rawRate; // 0.17 or 17 -> 0.17
  const monthlyInterest = Math.round((principal * rate) / 12);
  
  const start = p.startDate ? new Date(p.startDate + 'T00:00:00') : new Date();
  const end = p.endDate ? new Date(p.endDate + 'T00:00:00') : new Date();
  const today = new Date();
  today.setHours(0,0,0,0);
  
  const diffDays = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
  const isFinished = diffDays < 0;
  const isReturned = !!p.principalReturned;
  
  let totalMonths = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24 * 30.4375)));
  if(totalMonths <= 0) totalMonths = 12;
  const totalReturn = monthlyInterest * totalMonths;

  let elapsedMonths = 0;
  if(today > start){
    elapsedMonths = Math.min(totalMonths, Math.max(0, Math.floor((today - start) / (1000 * 60 * 60 * 24 * 30.4375))));
  }
  const accumulatedInterest = isFinished ? totalReturn : (monthlyInterest * elapsedMonths);
  const payDay = start.getDate();

  return {
    ratePercent: (rate * 100).toFixed(1),
    monthlyInterest,
    payDay,
    diffDays,
    isFinished,
    isReturned,
    totalReturn,
    accumulatedInterest,
    totalMonths
  };
}

function autoSyncYearEndAsset(targetStartYear){
  if(!data.assetSnapshots || !data.assetItems) return null;
  const prevYear = targetStartYear - 1;
  let targetSnapKey = prevYear + '-12';
  let snap = data.assetSnapshots[targetSnapKey];

  if(!snap || Object.keys(snap).length === 0){
    for(let m = 11; m >= 1; m--){
      const k = prevYear + '-' + String(m).padStart(2, '0');
      if(data.assetSnapshots[k] && Object.keys(data.assetSnapshots[k]).length > 0){
        targetSnapKey = k;
        snap = data.assetSnapshots[k];
        break;
      }
    }
  }

  if(!snap || Object.keys(snap).length === 0){
    const sortedKeys = Object.keys(data.assetSnapshots).filter(k => {
      const s = data.assetSnapshots[k];
      return s && Object.values(s).some(v => v > 0);
    }).sort().reverse();
    if(sortedKeys.length > 0){
      targetSnapKey = sortedKeys[0];
      snap = data.assetSnapshots[targetSnapKey];
    }
  }

  if(snap && Object.keys(snap).length > 0){
    let safeTotal = 0, investTotal = 0, fixedTotal = 0;
    data.assetItems.forEach(it=>{
      const v = snap[it.id] || 0;
      if(it.group === 'safe') safeTotal += v;
      else if(it.group === 'invest') investTotal += v;
      else if(it.group === 'fixed') fixedTotal += v;
    });
    const liquidTotal = safeTotal + investTotal;
    if(liquidTotal > 0){
      data.longRoadmap.startingAsset = liquidTotal;
    }
    if(fixedTotal > 0){
      data.longRoadmap.startingRealEstate = fixedTotal;
      if(data.longRoadmap.years && data.longRoadmap.years[0]){
        data.longRoadmap.years[0].realEstate = fixedTotal;
      }
    }
    return { targetSnapKey, liquidTotal, fixedTotal };
  }
  return null;
}

function setRoadmapStartYear(newStartYear){
  const lr = data.longRoadmap;

  lr.windowStartYear = newStartYear;
  if(!lr.years) lr.years = [];
  lr.years.sort((a,b)=>a.year-b.year);
  lr.years.forEach((y,i)=>{ y.year = newStartYear + i; });
}

function getDualAgeString(year){
  const lr = data.longRoadmap;
  if(!lr) return '';
  const myAge = lr.birthYear ? (year - lr.birthYear + 1) : null;
  const momAge = lr.motherBirthYear ? (year - lr.motherBirthYear + 1) : null;
  if(myAge && momAge) return `${myAge}/${momAge}`;
  if(myAge) return `${myAge}세`;
  return '';
}

function computeLongRoadmapRows(){
  const lr = data.longRoadmap;
  if(!lr || !lr.years) return [];
  lr.years.sort((a,b)=>a.year-b.year);

  let prevReturnAsset = lr.startingAsset || 0;

  return lr.years.map((y, idx)=>{
    const investable = (idx === 0) ? (lr.startingAsset || 0) : prevReturnAsset;
    const savings = y.savings || 0;
    const intermediateSum = investable + savings;
    const appliedRate = (y.returnPct !== undefined) ? (y.returnPct || 0) : 10;
    const isCrisis = (appliedRate >= 40);

    const afterReturn = intermediateSum * (1 + appliedRate / 100);
    prevReturnAsset = afterReturn;

    const realEstate = y.realEstate || 0;
    const grandTotal = afterReturn + realEstate;

    return {
      ...y,
      investable,
      savings,
      intermediateSum,
      afterReturn,
      appliedRate,
      isCrisis,
      realEstate,
      grandTotal
    };
  });
}

function longRoadmapGrowthChart(rows){
  if(rows.length < 2) return '';
  const w = 960, h = 240, padL=75, padR=25, padT=25, padB=35;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const totals = rows.map(r=>r.grandTotal);
  const investOnly = rows.map(r=>r.afterReturn);
  const maxV = Math.max(...totals) * 1.06 || 1;
  const minV = 0;
  const n = rows.length;
  const x = i => padL + (n===1?0:(i/(n-1))*innerW);
  const y = v => padT + innerH - ((v-minV)/(maxV-minV||1))*innerH;
  
  const totalPts = totals.map((v,i)=>({x:x(i),y:y(v)}));
  const investPts = investOnly.map((v,i)=>({x:x(i),y:y(v)}));
  
  const totalPath = totalPts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const investPath = investPts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPath = totalPath + ` L${totalPts[n-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${totalPts[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;

  const gridLines = Array.from({length:4},(_,i)=>{
    const frac = i/3;
    const val = minV + (maxV-minV)*(1-frac);
    const gy = padT + innerH*frac;
    return `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="var(--border-subtle)" stroke-width="1"/>
      <text x="${padL-10}" y="${gy+4}" text-anchor="end" font-size="10" fill="var(--ink-muted)">${eokwonAxis(val)}</text>`;
  }).join('');

  const step = n>12 ? Math.ceil(n/10) : 1;
  const xLabels = rows.map((r,i)=>{
    if(i%step!==0 && i!==n-1) return '';
    return `<text x="${x(i)}" y="${h-10}" text-anchor="middle" font-size="10.5" font-weight="${r.isCrisis?'700':'400'}" fill="${r.isCrisis?'var(--amber)':'var(--ink-muted)'}">${r.year}</text>`;
  }).join('');

  const milestoneMarkers = rows.map((r,i)=>{
    const cx = totalPts[i].x, cy = totalPts[i].y;
    if(r.isCrisis){
      return `
        <g>
          <line x1="${cx}" y1="${padT}" x2="${cx}" y2="${padT+innerH}" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
          <circle cx="${cx}" cy="${cy}" r="5" fill="var(--amber)" stroke="#fff" stroke-width="2"/>
          <text x="${cx}" y="${Math.max(padT+12, cy-10)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--amber)">🚀 ${r.appliedRate}%</text>
        </g>
      `;
    }
    if(r.visionImg){
      return `
        <g>
          <circle cx="${cx}" cy="${cy}" r="4.5" fill="#4F46E5" stroke="#fff" stroke-width="1.5"/>
          <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5">★</text>
        </g>
      `;
    }
    return '';
  }).join('');

  return `
    <div class="card full">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
        <h3 class="serif" style="margin:0;font-size:15px;letter-spacing:-0.02em;">30년 생애 자산 퀀텀 점프 복리 곡선</h3>
        <div style="display:flex;align-items:center;gap:12px;font-size:11px;color:var(--ink-secondary);">
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:3px;background:var(--amber);display:inline-block;border-radius:2px;"></span> 총자산(투자+부동산)</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:2px;background:var(--emerald);display:inline-block;border-radius:2px;"></span> 순수 투자자산</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="color:var(--amber);">🚀</span> 40% 이상 공격매수 찬스</span>
        </div>
      </div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
        <defs>
          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.0"/>
          </linearGradient>
        </defs>
        ${gridLines}
        <path d="${areaPath}" fill="url(#chartGrad)"/>
        <path d="${totalPath}" fill="none" stroke="var(--amber)" stroke-width="2.8"/>
        <path d="${investPath}" fill="none" stroke="var(--emerald)" stroke-width="1.6" stroke-dasharray="4,3"/>
        ${xLabels}
        ${milestoneMarkers}
      </svg>
    </div>
  `;
}

function longRoadmapView(){
  ensureLongRoadmap();
  const rows = computeLongRoadmapRows();
  const CHUNK = 11;
  const chunks = [];
  for(let i=0;i<rows.length;i+=CHUNK) chunks.push(rows.slice(i,i+CHUNK));
  const lr = data.longRoadmap;
  const nowYear = new Date().getFullYear();
  const activeStartYear = lr.windowStartYear || nowYear;
  const syncInfo = autoSyncYearEndAsset(activeStartYear);

  function buildChunkTable(chunkRows, chunkIdx){
    const yearHeads = chunkRows.map(r=>{
      const isCurrent = (r.year === nowYear);
      return `<th style="text-align:center;min-width:130px;padding:12px 6px;" class="${r.isCrisis?'crisis-th':''}">
        ${r.isCrisis ? `<div class="crisis-badge">🚀 위기찬스 ${r.appliedRate}%</div>` : ''}
        <div style="font-weight:700;font-size:14px;letter-spacing:-0.02em;">
          ${r.year}년${isCurrent?' <span style="font-size:11px;color:var(--brand);font-weight:700;">(올해)</span>':''}
        </div>
      </th>`;
    }).join('');

    const ageCells = chunkRows.map(r=>{
      const dualText = getDualAgeString(r.year);
      return `<td class="num" style="text-align:center;font-weight:700;color:var(--ink-secondary);font-size:12px;">${dualText || '39/67'}</td>`;
    }).join('');

    const lifeEventCells = chunkRows.map(r=>`
      <td><textarea class="ly-input autogrow" data-id="${r.id}" data-field="lifeEvent" placeholder="이슈" style="width:100%;font-size:11px;">${escapeHtml(r.lifeEvent||'')}</textarea></td>
    `).join('');

    const investableCells = chunkRows.map(r=>`
      <td class="num" style="font-weight:600;font-size:11.5px;color:var(--ink-secondary);">${won(r.investable)}</td>
    `).join('');

    const savingsCells = chunkRows.map(r=>`
      <td class="num"><input type="text" inputmode="numeric" class="ly-input money-input" data-id="${r.id}" data-field="savings" value="${(r.savings||0).toLocaleString('en-US')}" style="width:100px;font-size:11.5px;"></td>
    `).join('');

    const intermediateSumCells = chunkRows.map(r=>`
      <td class="num" style="font-size:12px;color:#854D0E;" title="${won(r.intermediateSum)}">${won(r.intermediateSum)}</td>
    `).join('');

    const afterReturnCells = chunkRows.map(r=>`
      <td class="num" style="font-weight:700;color:var(--emerald);font-size:12px;" title="${won(r.afterReturn)}">${won(r.afterReturn)}</td>
    `).join('');

    const returnPctCells = chunkRows.map(r=>`
      <td class="num ${r.isCrisis?'crisis-cell':''}"><input type="number" step="1" class="ly-input" data-id="${r.id}" data-field="returnPct" value="${r.appliedRate}" style="width:72px;font-size:11.5px;text-align:right;font-weight:${r.isCrisis?'700':'400'};color:${r.isCrisis?'#D97706':'inherit'};"> %</td>
    `).join('');

    const realEstateCells = chunkRows.map(r=>`
      <td class="num"><input type="text" inputmode="numeric" class="ly-input money-input" data-id="${r.id}" data-field="realEstate" value="${(r.realEstate||0).toLocaleString('en-US')}" style="width:100px;font-size:11.5px;"></td>
    `).join('');

    const grandTotalCells = chunkRows.map(r=>`
      <td class="num" style="font-size:13px;color:#854D0E;" title="${won(r.grandTotal)}">${bigWon(r.grandTotal)}</td>
    `).join('');

    const lifePlanCells = chunkRows.map(r=>`
      <td style="min-width:140px;">
        <textarea class="ly-input autogrow" data-id="${r.id}" data-field="lifePlan" placeholder="라이프 플랜" style="width:100%;font-size:11px;">${escapeHtml(r.lifePlan||'')}</textarea>
        ${r.visionImg ? `
          <div class="vision-thumb-wrap">
            <img src="${escapeHtml(r.visionImg)}" class="vision-thumb" title="클릭 시 사진 원본 보기" onclick="window.open('${escapeHtml(r.visionImg)}')">
          </div>` : ''}
        <input type="text" class="ly-input" data-id="${r.id}" data-field="visionImg" value="${escapeHtml(r.visionImg||'')}" placeholder="사진URL(비전보드)" style="width:100%;font-size:9.5px;margin-top:4px;">
      </td>
    `).join('');

    const growthPlanCells = chunkRows.map(r=>`
      <td style="min-width:140px;"><textarea class="ly-input autogrow" data-id="${r.id}" data-field="growthPlan" placeholder="자산 성장 계획" style="width:100%;font-size:11px;">${escapeHtml(r.growthPlan||'')}</textarea></td>
    `).join('');

    const rangeTitle = `${chunkRows[0].year}년 ~ ${chunkRows[chunkRows.length-1].year}년 구간`;

    return `
      <div style="font-size:14px;font-weight:700;color:var(--ink-secondary);margin:24px 0 8px;">
        구간 ${chunkIdx+1} (${rangeTitle})
      </div>
      <div class="card scrolltable" style="padding:12px;">
        <table class="budget">
          <tr><th style="min-width:110px;">연도</th>${yearHeads}</tr>
          <tr><td style="font-weight:600;">나이/엄마나이</td>${ageCells}</tr>
          <tr><td style="font-weight:600;">생애이슈</td>${lifeEventCells}</tr>
          <tr><td style="font-weight:600;">투자가능자산</td>${investableCells}</tr>
          <tr><td style="font-weight:600;">연 저축액</td>${savingsCells}</tr>
          <tr class="yellow-highlight"><td style="color:#854D0E;">합계 (투자+저축)</td>${intermediateSumCells}</tr>
          <tr><td style="font-weight:600;color:var(--emerald);">수익후자산</td>${afterReturnCells}</tr>
          <tr><td style="font-weight:600;">수익률 (%)</td>${returnPctCells}</tr>
          <tr><td style="font-weight:600;">부동산자산</td>${realEstateCells}</tr>
          <tr class="yellow-highlight"><td style="color:#854D0E;font-size:13px;">총자산 합계</td>${grandTotalCells}</tr>
          <tr><td style="font-weight:600;">라이프계획</td>${lifePlanCells}</tr>
          <tr><td style="font-weight:600;">자산성장계획</td>${growthPlanCells}</tr>
        </table>
      </div>
    `;
  }

  const tables = chunks.map((c,i)=>buildChunkTable(c,i)).join('');

  return `
    <div class="card">
      <div style="display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;">
        <button id="syncFromAssetBtn" class="rtabbtn" style="background:var(--emerald-soft);border-color:var(--emerald-border);color:var(--emerald);font-weight:600;">
          최신 자산현황 자동 동기화
        </button>
      </div>
      
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;">
        <div>
          <label class="flabel">시작 연도</label>
          <input type="number" id="lr-startyear" value="${activeStartYear}">
        </div>
        <div>
          <label class="flabel">시작 투자가능자산 (${activeStartYear}년 기준)</label>
          <input type="text" inputmode="numeric" class="money-input" id="lr-start" value="${(lr.startingAsset||359000000).toLocaleString('en-US')}">
          ${syncInfo ? `
            <div style="font-size:11px;color:var(--emerald);font-weight:600;margin-top:4px;">
              ✓ ${syncInfo.targetSnapKey.replace('-','년 ')}월 결산 잔액(${won(syncInfo.liquidTotal)})이 자동 반영되었습니다.
            </div>
          ` : `
            <div style="font-size:11px;color:var(--ink-muted);margin-top:3px;">
              * 직전 연도(${activeStartYear-1}년) 결산 자산이 자동으로 연동됩니다.
            </div>
          `}
        </div>
        <div>
          <label class="flabel">내 출생연도 (나이 자동계산)</label>
          <input type="number" id="lr-birthyear" value="${lr.birthYear||1988}" placeholder="1988">
        </div>
        <div>
          <label class="flabel">엄마 출생연도 (엄마나이 자동계산)</label>
          <input type="number" id="lr-mom-birthyear" value="${lr.motherBirthYear||1960}" placeholder="1960">
        </div>
      </div>
    </div>

    ${longRoadmapGrowthChart(rows)}
    ${tables}

    <div style="display:flex;gap:8px;margin-top:16px;">
      <input type="number" id="bulkYearsCount" placeholder="추가할 연도 수 (예: 5)" style="max-width:200px;">
      <button id="addYearsBulkBtn" class="rtabbtn active">미래 시뮬레이션 기간 연장</button>
    </div>
  `;
}

function actualTypeTotalForMonth(year, month, type){
  const d = new Date(year, month-1, 1);
  const {start,end} = monthBounds(d);
  return entriesInRange(start,end).filter(e=>catById(e.categoryId)?.type===type).reduce((s,e)=>s+e.amount,0);
}

function detailedAnnualSheetView(isActualMode){
  const year = roadmapYear;
  ensureDefaultDetailedAnnualPlan(year);
  const planData = isActualMode ? data.annualPlanActual[year] : data.annualPlan[year];
  if(!planData) return '';

  const modeTitle = isActualMode ? `${year} 머니플랜 실제 (정산)` : `${year} 머니플랜 (계획)`;
  const modeKey = isActualMode ? 'annualPlanActual' : 'annualPlan';

  const incomeRows = planData.incomeRows || [];
  const expenseRows = planData.expenseRows || [];

  // Monthly sums
  const incomeSums = {};
  const expenseSums = {};
  const netSums = {};
  const investableSums = {};

  let totalIncomeAll = 0;
  let totalExpenseAll = 0;

  for(let m=1; m<=12; m++){
    const mInc = incomeRows.reduce((s, r)=> s + (r.vals?.[m] || 0), 0);
    const mExp = expenseRows.reduce((s, r)=> s + (r.vals?.[m] || 0), 0);
    incomeSums[m] = mInc;
    expenseSums[m] = mExp;
    netSums[m] = mInc - mExp;
    investableSums[m] = mInc - mExp; // 구글시트 공식 동일
    totalIncomeAll += mInc;
    totalExpenseAll += mExp;
  }
  const netTotalAll = totalIncomeAll - totalExpenseAll;

  const monthHeads = Array.from({length:12}, (_, i)=> `<th style="text-align:right;min-width:85px;padding:8px 6px;">${i+1}월</th>`).join('');

  function renderRows(rows, typeCategory){
    return rows.map(r=>{
      let cells = '';
      let rowTotal = 0;
      for(let m=1; m<=12; m++){
        const v = r.vals?.[m] ?? '';
        const numV = (v===''||v==null) ? 0 : v;
        rowTotal += numV;
        const displayVal = (v===''||v==null) ? '' : (typeof v === 'number' ? v.toLocaleString('en-US') : v);
        cells += `<td class="num" style="padding:4px 3px;">
          <input type="text" class="det-cell-input" data-mode="${modeKey}" data-year="${year}" data-cat="${typeCategory}" data-id="${r.id}" data-month="${m}" value="${displayVal}" style="width:100%;font-size:11px;text-align:right;padding:3px 4px;border:1px solid #E2E8F0;border-radius:4px;">
        </td>`;
      }
      return `<tr>
        <td style="font-weight:600;white-space:nowrap;padding:6px 8px;background:#F8FAFC;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
            <span>${escapeHtml(r.name)}</span>
            <button class="rm-det-row" data-mode="${modeKey}" data-year="${year}" data-cat="${typeCategory}" data-id="${r.id}" style="border:none;background:none;color:var(--ink-muted);cursor:pointer;font-size:10px;">✕</button>
          </div>
        </td>
        ${cells}
        <td class="num" style="font-weight:700;padding:6px 8px;background:#F8FAFC;">${rowTotal===0?'-':won(rowTotal)}</td>
        <td style="padding:4px 6px;min-width:160px;">
          <input type="text" class="det-remark-input" data-mode="${modeKey}" data-year="${year}" data-cat="${typeCategory}" data-id="${r.id}" value="${escapeHtml(r.remark||'')}" placeholder="비고(메모)" style="width:100%;font-size:10.5px;padding:3px 6px;border:none;background:transparent;color:var(--ink-secondary);">
        </td>
      </tr>`;
    }).join('');
  }

  function sumRowCells(sumsObj){
    return Array.from({length:12}, (_, i)=> {
      const v = sumsObj[i+1] || 0;
      return `<td class="num" style="padding:6px 6px;">${v===0?'-':v.toLocaleString('ko-KR')}</td>`;
    }).join('');
  }

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="yearPrev" style="background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);width:32px;height:32px;cursor:pointer;">‹</button>
        <span class="serif" style="font-size:16px;font-weight:700;">${modeTitle}</span>
        <button id="yearNext" style="background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);width:32px;height:32px;cursor:pointer;">›</button>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="rtabbtn" id="addNewDetRowBtn" style="font-size:11.5px;padding:6px 12px;background:#fff;">+ 항목 추가</button>
        <button class="rtabbtn" id="resetToDefaultPlanBtn" style="font-size:11.5px;padding:6px 12px;color:var(--brand);background:#fff;">시트 기본값 불러오기</button>
      </div>
    </div>

    <div class="card scrolltable" style="padding:8px;box-shadow:var(--shadow-md);">
      <table class="budget" style="min-width:1300px;font-size:11.5px;">
        <thead>
          <tr style="background:#0F172A;color:#fff;">
            <th style="min-width:140px;color:#fff;background:#0F172A;padding:10px 8px;">구분</th>
            ${monthHeads}
            <th style="min-width:105px;text-align:right;color:#fff;background:#0F172A;padding:10px 8px;">합계</th>
            <th style="min-width:200px;color:#fff;background:#0F172A;padding:10px 8px;">비고</th>
          </tr>
        </thead>
        <tbody>
          <!-- 수입 영역 -->
          <tr style="background:#F1F5F9;"><td colspan="15" style="font-weight:700;color:var(--emerald);padding:6px 8px;">[ 수입 부문 ]</td></tr>
          ${renderRows(incomeRows, 'incomeRows')}
          <tr class="sheet-income-sum">
            <td style="padding:8px;font-weight:800;">수입합계</td>
            ${sumRowCells(incomeSums)}
            <td class="num" style="padding:8px;font-weight:800;">${won(totalIncomeAll)}</td>
            <td></td>
          </tr>

          <!-- 지출 영역 -->
          <tr style="background:#F1F5F9;"><td colspan="15" style="font-weight:700;color:var(--rose);padding:6px 8px;">[ 지출 부문 ]</td></tr>
          ${renderRows(expenseRows, 'expenseRows')}
          <tr class="sheet-expense-sum">
            <td style="padding:8px;font-weight:800;">지출합계</td>
            ${sumRowCells(expenseSums)}
            <td class="num" style="padding:8px;font-weight:800;">${won(totalExpenseAll)}</td>
            <td></td>
          </tr>

          <!-- 결산 행 -->
          <tr class="sheet-net-row">
            <td style="padding:8px;font-weight:700;">수입 - 지출</td>
            ${sumRowCells(netSums)}
            <td class="num" style="padding:8px;font-weight:700;color:${netTotalAll>=0?'var(--emerald)':'var(--rose)'};">${won(netTotalAll)}</td>
            <td></td>
          </tr>
          <tr class="sheet-investable-row">
            <td style="padding:8px;font-weight:800;">투자가능자산</td>
            ${sumRowCells(investableSums)}
            <td class="num" style="padding:8px;font-weight:800;">${bigWon(netTotalAll)}</td>
            <td style="font-size:11px;color:#854D0E;">* 월별 잉여자산 누적</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="summary-grid" style="grid-template-columns: repeat(3, 1fr);margin-top:14px;">
      <div class="box"><div class="lbl">연간 총 수입</div><div class="val" style="color:var(--emerald);">${bigWon(totalIncomeAll)}</div></div>
      <div class="box"><div class="lbl">연간 총 지출</div><div class="val" style="color:var(--rose);">${bigWon(totalExpenseAll)}</div></div>
      <div class="box"><div class="lbl">연간 투자가능자산</div><div class="val" style="color:#B45309;">${bigWon(netTotalAll)}</div></div>
    </div>
  `;
}

function shortRoadmapView(){
  const year = roadmapYear;
  if(!data.shortRoadmap[year]) data.shortRoadmap[year] = {items:[], plan:{}, actual:{}};
  const rm = data.shortRoadmap[year];

  function rowCells(itemId, kind){
    let cells='', total=0;
    for(let m=1;m<=12;m++){
      const store = rm[kind];
      if(!store[itemId]) store[itemId] = {};
      const v = store[itemId][m]||0; total+=v;
      cells += `<td class="num"><input type="text" inputmode="numeric" class="rm-item-input money-input" data-item="${itemId}" data-kind="${kind}" data-month="${m}" value="${(v||0).toLocaleString('en-US')}" style="width:78px;font-size:11px;"></td>`;
    }
    return {cells,total};
  }
  const monthHeads = Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('');

  const planSection = (rm.items || []).map(it=>{
    const {cells,total} = rowCells(it.id,'plan');
    return `<tr><td>${escapeHtml(it.name)}<button class="rm-item" data-id="${it.id}" style="margin-left:4px;border:none;background:none;color:var(--ink-muted);cursor:pointer;">✕</button></td>${cells}<td class="num" style="font-weight:700;">${won(total)}</td></tr>`;
  }).join('');
  const actualSection = (rm.items || []).map(it=>{
    const {cells,total} = rowCells(it.id,'actual');
    return `<tr><td>${escapeHtml(it.name)}</td>${cells}<td class="num" style="font-weight:700;">${won(total)}</td></tr>`;
  }).join('');

  const planTotal = (rm.items || []).reduce((s,it)=>{ const store=rm.plan[it.id]||{}; return s+Object.values(store).reduce((a,b)=>a+(b||0),0); },0);
  const actualTotal = (rm.items || []).reduce((s,it)=>{ const store=rm.actual[it.id]||{}; return s+Object.values(store).reduce((a,b)=>a+(b||0),0); },0);
  const rate = planTotal>0 ? Math.round(actualTotal/planTotal*100) : 0;

  return `
    <div class="monthnav">
      <button id="yearPrev">‹</button>
      <div class="m serif">${year}년 단기로드맵</div>
      <button id="yearNext">›</button>
    </div>
    <div class="card">
      <div style="display:flex;gap:6px;align-items:center;">
        <input id="newRmItem" placeholder="항목 이름 (예: 월급저축, 배당금)" style="flex:1;">
        <button id="addRmItem" class="rtabbtn active">추가</button>
      </div>
    </div>
    <div class="card scrolltable">
      <div class="grouplabel" style="margin:4px 0 8px;">계획 · 연 목표 ${won(planTotal)}</div>
      <table class="budget">
        <tr><th>항목</th>${monthHeads}<th>합계</th></tr>
        ${planSection || '<tr><td colspan="14" style="text-align:center;color:var(--ink-muted);">항목을 추가해보세요</td></tr>'}
      </table>
    </div>
    <div class="card scrolltable">
      <div class="grouplabel" style="margin:4px 0 8px;">실행 · 연 누적 ${won(actualTotal)} · 달성률 ${rate}%</div>
      <table class="budget">
        <tr><th>항목</th>${monthHeads}<th>합계</th></tr>
        ${actualSection || '<tr><td colspan="14" style="text-align:center;color:var(--ink-muted);">항목을 추가해보세요</td></tr>'}
      </table>
    </div>
  `;
}

  const curYear = mon.getFullYear();
  const curMonth = mon.getMonth() + 1;
  const monthEvent = getAnnualEventForMonth(curYear, curMonth);

  const daysHtml = days.map((d,i)=>{
    const diso = isoDate(d);
    const dayEntries = (data.entries || []).filter(e=>e.date===diso);
    const total = dayEntries.filter(e=>catById(e.categoryId)?.type==='expense').reduce((s,e)=>s+e.amount,0);
    const entriesHtml = dayEntries.map(e=>{
      const c = catById(e.categoryId);

        <div class="actions">
          <button class="edit" data-eid="${e.id}">수정</button>
          <button class="del" data-eid="${e.id}">삭제</button>

      </div>`;
    }).join('');

    const dayBudgets = (data.dailyCategoryBudgets && data.dailyCategoryBudgets[diso]) || {};
    const budgetChips = wkVarCats.filter(c=>dayBudgets[c.id]).map(c=>`
      <div class="entry" style="background:var(--amber-soft);border-radius:4px;padding:3px 5px;margin-bottom:3px;border-bottom:none;">

    return `

  }).join('');

  const budgetRows = wkVarCats.map(c=>{

    const weeklyBudget = c.weeklyBudget!=null ? c.weeklyBudget : Math.round((c.budget||0)/4.345);

    </div>

    ${monthEvent ? `
      <div class="event-banner">
        <span class="badge">이번 달 머니플랜 이벤트</span>

    <div class="daysrow" style="margin-bottom:16px;">${daysHtml}</div>

    ${categoryDonutChart(rangeEntries, 'expense', '이번 주 지출 분석')}

    <div class="card-grid">
      <div class="card">

        <table class="budget">
          <tr><th>항목</th><th class="num">주간예산</th><th class="num">정산</th><th class="num">오차</th></tr>
          ${budgetRows || '<tr><td colspan="4" style="text-align:center;color:var(--ink-muted);">등록된 변동지출이 없습니다.</td></tr>'}
        </table>
      </div>

      <div class="card">
        <h3 class="serif" style="margin:0 0 6px;font-size:14px;">이번 달 고정 항목 (월 1회 정산)</h3>
        <div style="font-size:11px;color:var(--ink-muted);margin-bottom:8px;">근로소득, 월급저축, 보험료처럼 한 달에 한 번 발생하는 항목입니다. 발생일에 [기록]을 누르면 완료 처리됩니다.</div>

function monthView(){
  const mk = monKey(monthRef);
  const bounds = monthBounds(monthRef);
  const rangeEntries = entriesInRange(bounds.start, bounds.end);

  const curYear = monthRef.getFullYear();
  const curMonth = monthRef.getMonth() + 1;
  const monthEvent = getAnnualEventForMonth(curYear, curMonth);

  // Calculate project interest received for this month
  const projInterest = getReceivedProjectInterestForMonth(curYear, curMonth);

  const sumByType = t => rangeEntries.filter(e=>catById(e.categoryId)?.type===t).reduce((s,e)=>s+e.amount,0);
  let income = sumByType('income') + projInterest.total;
  const expense = sumByType('expense');
  const saving = sumByType('saving');
  const net = income - expense - saving;

  const mfb = data.monthFeedback[mk] || {total:'', best:'', worst:'', next:''};

  function mBudget(c){ return (data.monthlyBudgets[mk] && data.monthlyBudgets[mk][c.id]!==undefined) ? data.monthlyBudgets[mk][c.id] : (c.budget||0); }

  // Fixed Expense breakdown
  const fixedExpenseCats = (data.categories || []).filter(c=> c.type==='expense' && (c.subtype||'variable')==='fixed');
  let fixedBudgetSum = 0, fixedActualSum = 0;
  const fixedExpenseRows = fixedExpenseCats.map(c=>{
    const spent = rangeEntries.filter(e=>e.categoryId===c.id).reduce((s,e)=>s+e.amount,0);
    const budget = mBudget(c);
    fixedBudgetSum += budget;
    fixedActualSum += spent;
    const diff = budget - spent;
    return `<tr>
      <td>${escapeHtml(c.name)}</td>
      <td class="num">${won(budget)}</td>
      <td class="num">${won(spent)}</td>
      <td class="num ${diff<0?'diff-over':'diff-under'}">${diff<0?'-':'+'}${won(Math.abs(diff))}</td>
    </tr>`;
  }).join('');
  const fixedDiff = fixedBudgetSum - fixedActualSum;

  // Variable Expense breakdown
  const varExpenseCats = (data.categories || []).filter(c=> c.type==='expense' && (c.subtype||'variable')==='variable');
  let varBudgetSum = 0, varActualSum = 0;
  const varExpenseRows = varExpenseCats.map(c=>{
    const spent = rangeEntries.filter(e=>e.categoryId===c.id).reduce((s,e)=>s+e.amount,0);
    const budget = mBudget(c);
    varBudgetSum += budget;
    varActualSum += spent;
    const diff = budget - spent;
    return `<tr>
      <td>${escapeHtml(c.name)}</td>
      <td class="num">${won(budget)}</td>
      <td class="num">${won(spent)}</td>
      <td class="num ${diff<0?'diff-over':'diff-under'}">${diff<0?'-':'+'}${won(Math.abs(diff))}</td>
    </tr>`;
  }).join('');
  const varDiff = varBudgetSum - varActualSum;

  // Income rows (with project interest linked to finance income)

        <table class="budget">
          <tr><th>항목</th><th class="num">월예산</th><th class="num">실제</th><th class="num">오차</th></tr>
          ${varExpenseRows || '<tr><td colspan="4" style="text-align:center;">기록 없음</td></tr>'}
          <tr style="background:#F8FAFC;font-weight:700;">
            <td>변동지출 소계</td>
            <td class="num">${won(varBudgetSum)}</td>
            <td class="num">${won(varActualSum)}</td>
            <td class="num ${varDiff<0?'diff-over':'diff-under'}">${varDiff<0?'-':'+'}${won(Math.abs(varDiff))}</td>

      <!-- 수입, 저축 및 월말 피드백 카드 -->

          <tr><th>항목</th><th class="num">예상</th><th class="num">실제</th><th class="num">오차</th></tr>

          <tr><th>항목</th><th class="num">월예산</th><th class="num">실제</th><th class="num">오차</th></tr>

        <div style="border-top:1px dashed var(--border-subtle);margin-top:16px;padding-top:12px;">

function projectView(){
  const year = projectMonthRef.getFullYear();
  const month = projectMonthRef.getMonth();
  const mk = year + '-' + String(month+1).padStart(2,'0');
  if(!data.projectReceipts[mk]) data.projectReceipts[mk] = {};

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstWeekday = new Date(year, month, 1).getDay();

  const activeProjects = (data.projects || []).filter(p => p.includeInSummary !== false);
  const totalPrincipal = activeProjects.reduce((s,p)=> s + (p.principal||0), 0);
  const totalMonthlyInterest = activeProjects.reduce((s,p)=> s + getProjectStats(p).monthlyInterest, 0);
  const returnedPrincipalSum = (data.projects || []).filter(p=> p.principalReturned).reduce((s,p)=> s + (p.principal||0), 0);

  const curReceipts = data.projectReceipts[mk] || {};
  const receivedCount = (data.projects || []).filter(p=> curReceipts[p.id]?.received).length;
  const receivedInterestSum = (data.projects || []).filter(p=> curReceipts[p.id]?.received)
    .reduce((s,p)=> s + (curReceipts[p.id].customAmount != null ? curReceipts[p.id].customAmount : getProjectStats(p).monthlyInterest), 0);

  // Calendar View Rendering
  let cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push('<div class="calday blank"></div>');
  for(let day=1;day<=daysInMonth;day++){
    const curDateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    
    // 1. 매월 이자 입금일
    const interestToday = (data.projects || []).filter(p=>{
      if(!p.startDate) return false;
      const d = new Date(p.startDate+'T00:00:00');
      return d.getDate() === day;
    });

    // 2. 만기일 원금 상환 도래
    const maturityToday = (data.projects || []).filter(p=>{
      return p.endDate === curDateStr;
    });

    const interestChips = interestToday.map(p=>{
      const r = curReceipts[p.id];
      const received = r && r.received;
      const stats = getProjectStats(p);
      return `<div class="projchip ${received?'received':''}" data-pid="${p.id}" data-action="toggle-interest" title="${escapeHtml(p.code||p.nameKr)}: 클릭 시 당월 이자 수령 확인">
        ${received?'✓ ':''}${escapeHtml(p.code||p.nameKr)} <span style="font-size:8.5px;opacity:0.9;">(${manwon(stats.monthlyInterest)})</span>
      </div>`;
    }).join('');

    const maturityChips = maturityToday.map(p=>{
      const returned = !!p.principalReturned;
      return `<div class="projchip" data-pid="${p.id}" data-action="toggle-principal" style="background:${returned?'#047857':'#BE185D'};color:#fff;font-weight:700;" title="클릭 시 원금 회수 확인 토글">
        ${returned?'✓ [원금회수]':'⚡ [만기원금]'} ${escapeHtml(p.code||p.nameKr)} (${manwon(p.principal)})
      </div>`;
    }).join('');

    cells.push(`<div class="calday"><div class="dnum">${day}</div>${maturityChips}${interestChips}</div>`);
  }
  while(cells.length % 7 !== 0) cells.push('<div class="calday blank"></div>');

  // Management List View Rendering (Screenshot Exact Reproduction)
  const projCards = (data.projects || []).map(p=>{
    const stats = getProjectStats(p);
    const isReceivedThisMonth = !!curReceipts[p.id]?.received;
    const isIncluded = p.includeInSummary !== false;

    const statusBadge = stats.isReturned
      ? `<span style="color:#047857;font-weight:700;font-size:12px;">원금회수완료</span>`
      : (stats.isFinished 
          ? `<span style="color:#64748B;font-weight:700;font-size:12px;">만기완료</span>` 
          : `<span style="color:#059669;font-weight:700;font-size:12px;">운용중</span>`);

    const dDayText = stats.diffDays >= 0 ? `D-${stats.diffDays}` : `D+${Math.abs(stats.diffDays)}`;

    return `
      <div class="card" style="margin-bottom:16px;padding:16px 20px;border:1px solid var(--border-subtle);background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);">
        <!-- Title & Delete -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <h4 style="margin:0;font-size:15px;font-weight:700;color:var(--ink-primary);">${escapeHtml(p.code || p.nameKr || '신규 프로젝트')}</h4>
          <button class="rm-project-card-btn" data-id="${p.id}" style="border:none;background:none;color:#F43F5E;font-size:16px;cursor:pointer;padding:2px 6px;">✕</button>
        </div>

        <!-- Inclusion Checkbox -->
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--ink-secondary);display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" class="proj-input-chk" data-id="${p.id}" ${isIncluded?'checked':''} style="width:14px;height:14px;accent-color:#2563EB;">
            <span>정산(합계)에 포함 — <span style="color:var(--ink-muted);font-size:11.5px;">체크 해제하면 위 요약 총액과 수입 계획 자동채움에서 이 프로젝트만 제외돼요</span></span>
          </label>
        </div>

        <!-- Row 1: Code and English Name -->
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
          <div style="display:flex;border:1px solid #CBD5E1;border-radius:4px;overflow:hidden;flex:1;min-width:240px;">
            <span style="background:#F1F5F9;padding:6px 10px;font-size:11.5px;color:var(--ink-secondary);border-right:1px solid #CBD5E1;white-space:nowrap;display:flex;align-items:center;">프로젝트번호</span>
            <input type="text" class="proj-input-text" data-id="${p.id}" data-field="code" value="${escapeHtml(p.code||'')}" placeholder="PR26 Siana nine" style="border:none;flex:1;padding:6px 10px;font-size:12px;outline:none;">
          </div>
          <div style="display:flex;border:1px solid #CBD5E1;border-radius:4px;overflow:hidden;flex:1;min-width:160px;">
            <input type="text" class="proj-input-text" data-id="${p.id}" data-field="nameEn" value="${escapeHtml(p.nameEn||'')}" placeholder="영문명" style="border:none;width:100%;padding:6px 10px;font-size:12px;outline:none;">
          </div>
        </div>

        <!-- Row 2: Principal, Start Date, End Date -->
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
          <div style="flex:1.2;min-width:180px;">
            <input type="text" inputmode="numeric" class="money-input proj-input-money" data-id="${p.id}" value="${(p.principal||0).toLocaleString('en-US')}" placeholder="투자 원금" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 10px;font-size:12px;">
          </div>
          <div style="flex:1;min-width:160px;">
            <input type="date" class="proj-input-date" data-id="${p.id}" data-field="startDate" value="${p.startDate||''}" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 8px;font-size:12px;">
          </div>
          <div style="flex:1;min-width:160px;">
            <input type="date" class="proj-input-date" data-id="${p.id}" data-field="endDate" value="${p.endDate||''}" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 8px;font-size:12px;">
          </div>
        </div>

        <!-- Row 3: Rates (1, 2, 3) and Memo -->
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
          <div style="width:80px;">
            <input type="text" class="proj-input-text" data-id="${p.id}" data-field="rate1" value="${p.rate1!=null?p.rate1:''}" placeholder="0.17" title="1년차 연수익률 (예: 0.17 또는 17)" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 8px;font-size:12px;">
          </div>
          <div style="width:80px;">
            <input type="text" class="proj-input-text" data-id="${p.id}" data-field="rate2" value="${p.rate2!=null?p.rate2:''}" placeholder="2년차%" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 8px;font-size:12px;">
          </div>
          <div style="width:80px;">
            <input type="text" class="proj-input-text" data-id="${p.id}" data-field="rate3" value="${p.rate3!=null?p.rate3:''}" placeholder="3년차%" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 8px;font-size:12px;">
          </div>
          <div style="flex:1;min-width:220px;">
            <input type="text" class="proj-input-text" data-id="${p.id}" data-field="memo" value="${escapeHtml(p.memo||'')}" placeholder="메모 (예: 만기보유, 상환이후 미주 투자금)" style="width:100%;border:1px solid #CBD5E1;border-radius:4px;padding:6px 10px;font-size:12px;">
          </div>
        </div>

        <!-- Row 4: Status Meta Bar and Action Buttons -->
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px dashed var(--border-subtle);flex-wrap:wrap;gap:10px;">
          <div style="font-size:12px;color:var(--ink-secondary);line-height:1.6;">
            ${statusBadge} &nbsp;·&nbsp; 적용수익률 <b>${stats.ratePercent}%</b> &nbsp;·&nbsp; 월수익금 <b style="color:var(--emerald);">${won(stats.monthlyInterest)}</b> &nbsp;·&nbsp; 매월 <b>${stats.payDay}일</b> &nbsp;·&nbsp; 만기 <b>${dDayText}</b> &nbsp;·&nbsp; 누적이자 <b>${won(stats.accumulatedInterest)}</b> &nbsp;·&nbsp; 만기총수익 <b>${won(stats.totalReturn)}</b>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="proj-btn-interest rtabbtn" data-pid="${p.id}" style="font-size:11.5px;padding:5px 12px;background:${isReceivedThisMonth?'#ECFDF5':'#fff'};color:${isReceivedThisMonth?'var(--emerald)':'inherit'};">
              ${isReceivedThisMonth ? '✓ 당월 이자 수령완료' : '당월 이자 입금확인'}
            </button>
            <button class="proj-btn-principal rtabbtn" data-pid="${p.id}" style="font-size:11.5px;padding:5px 12px;background:${stats.isReturned?'#FEF2F2':'#F8FAFC'};color:${stats.isReturned?'#DC2626':'#475569'};font-weight:600;">
              ${stats.isReturned ? '✓ 만기원금 회수완료' : '⚡ 만기원금 회수처리'}
            </button>
          </div>
        </div>
      </div>

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div class="monthnav" style="margin-bottom:0;">
        <button id="projPrev">‹</button>
        <div class="m serif">${year}년 ${month+1}월 프로젝트 관리</div>
        <button id="projNext">›</button>
      </div>

      <!-- Sub tabs -->
      <div style="display:flex;gap:6px;">
        <button class="rtabbtn ${projectSubTab==='calendar'?'active':''}" data-ptab="calendar" style="padding:7px 14px;font-size:12px;">
          📅 프로젝트 캘린더
        </button>
        <button class="rtabbtn ${projectSubTab==='manage'?'active':''}" data-ptab="manage" style="padding:7px 14px;font-size:12px;">
          📋 프로젝트 등록 &amp; 관리 (${(data.projects||[]).length})
        </button>
      </div>
    </div>

    <!-- Summary Overview Header -->
    <div class="summary-grid" style="grid-template-columns: repeat(4, 1fr);margin-bottom:14px;">
      <div class="box">
        <div class="lbl">운용 중 원금</div>
        <div class="val" style="color:var(--indigo);">${bigWon(totalPrincipal)}</div>
      </div>
      <div class="box">
        <div class="lbl">월 예상 총이자 (연 ${bigWon(totalMonthlyInterest*12)})</div>
        <div class="val" style="color:var(--emerald);">${won(totalMonthlyInterest)}</div>
      </div>
      <div class="box">
        <div class="lbl">${month+1}월 확정 수령이자 (${receivedCount}/${(data.projects||[]).length}건)</div>

      </div>
      <div class="box">
        <div class="lbl">만기 회수(상환) 완료 원금</div>
        <div class="val" style="color:#047857;">${bigWon(returnedPrincipalSum)}</div>
      </div>
    </div>

    ${projectSubTab === 'calendar' ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h3 class="serif" style="margin:0;font-size:14.5px;">${month+1}월 입금일 &amp; 만기 캘린더</h3>
          <span style="font-size:11px;color:var(--ink-muted);">💡 이자 칩을 누르면 수령완료(초록) 처리되며, 만기 칩을 누르면 원금 회수완료 처리가 연동됩니다.</span>
        </div>
        <div class="calhead"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="calgrid">${cells.join('')}</div>
      </div>
    ` : `
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
        <button id="addNewProjectCardBtn" class="rtabbtn active" style="padding:8px 16px;font-size:12.5px;">

        </button>

      </div>
    `}
  `;
}

function catView(){
  const expCats = (data.categories || []).filter(c=>c.type==='expense');
  const incCats = (data.categories || []).filter(c=>c.type==='income');
  const savCats = (data.categories || []).filter(c=>c.type==='saving');

  function buildCatSection(list, typeLabel, colorBadge){
    const rows = list.map(c=>{

      return `

          <span class="tag ${tagClass(c)}">${tagLabel(c)}</span>

          <div style="display:flex;align-items:center;gap:4px;">
            <span style="font-size:11px;color:var(--ink-muted);">월예산:</span>

          <div style="display:flex;align-items:center;gap:4px;">
            ${isVar ? `
              <span style="font-size:11px;color:var(--ink-muted);">주예산:</span>
