          </div>
          <button class="rm-cat" data-cid="${c.id}" style="color:var(--ink-muted);border:none;background:none;cursor:pointer;font-size:13px;text-align:right;">✕</button>
        </div>
      `;
    }).join('');

    return `
      <div style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:700;color:var(--ink-primary);display:flex;align-items:center;gap:6px;">
            <span style="width:8px;height:8px;border-radius:50%;background:${colorBadge};"></span>
            ${typeLabel} (${list.length}개)
          </div>
        </div>
        <div class="catlist">${rows || '<div style="font-size:12px;color:var(--ink-muted);padding:8px 0;">등록된 카테고리가 없습니다.</div>'}</div>
      </div>
    `;
  }

  return `
    <div class="card">
      <h3 class="serif" style="margin:0 0 8px;font-size:15px;">대시보드 기본 정보</h3>
      <label class="flabel">가계부 제목</label>
      <div style="display:flex;gap:8px;">
        <input id="appTitleInput" value="${escapeHtml(data.appTitle||'나의 자산 플래너')}" placeholder="가계부 제목을 입력하세요" style="flex:1;">
        <button id="saveTitleBtn" class="rtabbtn active">제목 저장</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--border-subtle);padding-bottom:10px;">
        <div>
          <h3 class="serif" style="margin:0 0 4px;font-size:15px;">카테고리 &amp; 기준 예산 설정</h3>
          <div style="font-size:11.5px;color:var(--ink-secondary);">
            지출, 수입, 저축 별로 명확히 분리 관리됩니다. 변동비 항목은 월예산 입력 시 <b>주간 예산(월÷4.3)</b>이 자동 계산됩니다.
          </div>
        </div>
      </div>

      ${buildCatSection(expCats, '지출 카테고리', 'var(--rose)')}
      ${buildCatSection(incCats, '수입 카테고리', 'var(--amber)')}
      ${buildCatSection(savCats, '저축 및 투자 카테고리', 'var(--emerald)')}

      <div style="background:var(--bg-subtle);padding:14px;border-radius:var(--radius-md);margin-top:16px;">
        <div style="font-weight:600;font-size:12.5px;margin-bottom:8px;">+ 신규 카테고리 등록</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <select id="newCatType">
            <option value="expense">지출</option>
            <option value="income">수입</option>
            <option value="saving">저축·투자</option>
          </select>
          <select id="newCatSubtype">
            <option value="variable">변동 (매주 정산 통제)</option>
            <option value="fixed">고정 (월 1회 정산)</option>
          </select>
          <input id="newCatName" placeholder="카테고리명 (예: 식비, 외식, 보험)" style="flex:1;min-width:140px;">
          <button id="addCatBtn" class="rtabbtn active">카테고리 추가</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="serif" style="margin:0 0 10px;font-size:15px;">기기 실시간 연동 및 데이터 관리</h3>
      <div style="font-size:11.5px;color:var(--ink-secondary);margin-bottom:14px;line-height:1.5;">
        현재 클라우드 연동 코드: <b>${escapeHtml(currentSyncKey)}</b><br>
        스마트폰과 PC에서 동일한 코드를 입력하면 저장 즉시 1초 만에 데이터가 상호 동기화됩니다.
      </div>
      <button id="changeSyncKeyBtn" class="rtabbtn active" style="padding:9px 15px;">연동 코드 변경하기</button>
      
      <div style="margin-top:20px;border-top:1px dashed var(--border-subtle);padding-top:14px;">
        <h4 style="margin:0 0 8px;font-size:13px;">백업 파일 다운로드 &amp; 복원</h4>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="exportBackupBtn" class="rtabbtn" style="padding:8px 14px;">백업 파일 다운로드</button>
          <button id="importBackupBtn" class="rtabbtn" style="padding:8px 14px;">백업 파일 불러오기</button>
          <input type="file" id="importFileInput" accept="application/json" style="display:none;">
        </div>
      </div>
    </div>
  `;
}

function openAddBudgetModal(dateISO){
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  const varCats = (data.categories || []).filter(c=>c.type==='expense' && (c.subtype||'variable')==='variable');
  const catOpts = varCats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  wrap.innerHTML = `
    <div class="modal">
      <h3 class="serif">${dateISO} 일일 예산 배정</h3>
      <div class="row"><select id="b-cat">${catOpts || '<option value="">변동지출 카테고리가 없어요</option>'}</select></div>
      <div class="row"><input id="b-amt" type="text" inputmode="numeric" class="money-input" placeholder="이 날 쓸 예산 금액"></div>
      <div class="actions">
        <button class="cancel" id="b-cancel">취소</button>
        <button class="primary" id="b-save">배정 저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('b-cancel').onclick = ()=> wrap.remove();
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  document.getElementById('b-save').onclick = async ()=>{
    const categoryId = document.getElementById('b-cat').value;
    const amount = parseWon(document.getElementById('b-amt').value);
    if(!categoryId){ showToast('카테고리를 먼저 만들어주세요', 'error'); return; }
    if(amount<=0){ showToast('올바른 금액을 입력해주세요', 'error'); return; }
    if(!data.dailyCategoryBudgets) data.dailyCategoryBudgets = {};
    if(!data.dailyCategoryBudgets[dateISO]) data.dailyCategoryBudgets[dateISO] = {};
    data.dailyCategoryBudgets[dateISO][categoryId] = amount;
    await save();
    wrap.remove();
    render();
    showToast('일일 예산이 배정되었습니다.');
  };
}

function openEntryModal(dateISO, opts){
  opts = opts || {};
  const existing = opts.entry || null;
  const isEdit = !!existing;
  const initialDate = isEdit ? existing.date : (dateISO || isoDate(new Date()));
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  const catOpts = (data.categories || []).map(c=>`<option value="${c.id}" ${existing&&existing.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');

  wrap.innerHTML = `
    <div class="modal">
      <h3 class="serif">${isEdit?'거래 기록 수정':'거래 기록 추가'}</h3>
      <div class="row"><input type="date" id="m-date" value="${initialDate}"></div>
      <div class="row"><select id="m-cat">${catOpts}</select></div>
      <div class="row"><input id="m-item" placeholder="품목 (예: 장보기, 점심식사)" value="${isEdit?escapeHtml(existing.item||''):''}"></div>
      <div class="row"><input id="m-amt" type="text" inputmode="numeric" class="money-input" placeholder="금액" value="${isEdit?existing.amount.toLocaleString('en-US'):''}"></div>
      <div class="actions">
        <button class="cancel" id="m-cancel">취소</button>
        <button class="primary" id="m-save">${isEdit?'수정 저장':'저장'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('m-cancel').onclick = ()=> wrap.remove();
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };

  document.getElementById('m-save').onclick = async ()=>{
    const date = document.getElementById('m-date').value || initialDate;
    const categoryId = document.getElementById('m-cat').value;
    const item = document.getElementById('m-item').value.trim();
    const amount = parseWon(document.getElementById('m-amt').value);
    if(amount<=0){ showToast('올바른 금액을 입력해주세요.', 'error'); return; }
    if(isEdit){
      existing.date = date; existing.categoryId = categoryId; existing.item = item; existing.amount = amount;
    } else {
      data.entries.push({id:uid(), date, categoryId, item, amount});
    }
    await save();
    wrap.remove();
    render();
    showToast(isEdit?'기록이 수정되었습니다.':'기록이 추가되었습니다.');
  };
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '자산플래너-백업-'+isoDate(new Date())+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('백업 파일이 저장되었습니다.');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== 'object'){ showToast('올바른 백업 파일이 아닙니다.', 'error'); return; }
      showConfirmModal('백업 파일을 불러오면 현재 데이터가 덮어씌워집니다. 진행하시겠습니까?', async ()=>{
        data = parsed;
        applyMigrationsAndDefaults();
        await save();
        render();
        showToast('데이터를 성공적으로 불러왔습니다.');
      });
    }catch(err){ showToast('파일 읽기 실패: '+err.message, 'error'); }
  };
  reader.readAsText(file);
}

function render(){
  const appEl = document.getElementById('app');
  if(!appEl) return;
  const syncBadgeText = `<span class="dot"></span>동기화 코드: ${escapeHtml(currentSyncKey)}`;

  appEl.innerHTML = `
    <header class="top">
      <div>
        <h1>${escapeHtml(data.appTitle||'나의 자산 플래너')}</h1>
      </div>
      <div class="sync-badge" id="syncStatusBadge" title="클릭하여 동기화 코드 변경">${syncBadgeText}</div>
    </header>
    <nav class="tabs">
      <button data-tab="week" class="${currentTab==='week'?'active':''}">주간입력</button>
      <button data-tab="month" class="${currentTab==='month'?'active':''}">월간통계</button>
      <button data-tab="roadmap" class="${currentTab==='roadmap'?'active':''}">머니플랜·로드맵</button>
      <button data-tab="asset" class="${currentTab==='asset'?'active':''}">자산현황</button>
      <button data-tab="project" class="${currentTab==='project'?'active':''}">프로젝트</button>
      <button data-tab="search" class="${currentTab==='search'?'active':''}">검색</button>
      <button data-tab="cat" class="${currentTab==='cat'?'active':''}">카테고리·예산 설정</button>
    </nav>
    <div id="tabbody"></div>
  `;

  appEl.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; render(); };
  });

  const body = document.getElementById('tabbody');
  try {
    if(currentTab==='roadmap') body.innerHTML = roadmapView();
    else if(currentTab==='asset') body.innerHTML = assetView();
    else if(currentTab==='week') body.innerHTML = weekView();
    else if(currentTab==='month') body.innerHTML = monthView();
    else if(currentTab==='project') body.innerHTML = projectView();
    else if(currentTab==='search') body.innerHTML = searchView();
    else if(currentTab==='cat') body.innerHTML = catView();
  } catch(err) {
    console.error("Render error in tab:", currentTab, err);
    body.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;color:var(--rose);">
      <h3 style="margin-top:0;">화면을 불러오는 도중 문제가 발생했습니다.</h3>
      <div style="font-size:12px;color:var(--ink-secondary);margin-bottom:14px;">${escapeHtml(err.message)}</div>
      <button class="rtabbtn active" onclick="location.reload()">새로고침</button>
    </div>`;
  }

  bindTabEvents();
  setTimeout(adjustAllAutogrowTextareas, 20);
}

function bindTabEvents(){
  const syncStatusBadge = document.getElementById('syncStatusBadge');
  if(syncStatusBadge) syncStatusBadge.onclick = openSyncSettingsModal;

  const changeSyncKeyBtn = document.getElementById('changeSyncKeyBtn');
  if(changeSyncKeyBtn) changeSyncKeyBtn.onclick = openSyncSettingsModal;

  const saveTitleBtn = document.getElementById('saveTitleBtn');
  if(saveTitleBtn){
    saveTitleBtn.onclick = async ()=>{
      const val = document.getElementById('appTitleInput').value.trim();
      if(!val) return;
      data.appTitle = val;
      await save();
      render();
      showToast('가계부 제목이 변경되었습니다.');
    };
  }

  document.querySelectorAll('textarea.autogrow, textarea.feedback').forEach(ta=>{
    adjustTextareaHeight(ta);
    ta.addEventListener('input', ()=> adjustTextareaHeight(ta));
  });

  document.querySelectorAll('[data-rtab]').forEach(b=>{
    b.onclick = ()=>{ roadmapSubTab = b.dataset.rtab; render(); };
  });

  const yearPrev = document.getElementById('yearPrev');
  const yearNext = document.getElementById('yearNext');
  if(yearPrev) yearPrev.onclick = ()=>{ roadmapYear--; render(); };
  if(yearNext) yearNext.onclick = ()=>{ roadmapYear++; render(); };

  // Detailed Annual Sheet inputs & handlers
  document.querySelectorAll('.det-cell-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const modeKey = inp.dataset.mode;
      const y = parseInt(inp.dataset.year);
      const cat = inp.dataset.cat;
      const id = inp.dataset.id;
      const m = parseInt(inp.dataset.month);
      const val = parseWon(inp.value);

      if(!data[modeKey]) data[modeKey] = {};
      if(!data[modeKey][y]) ensureDefaultDetailedAnnualPlan(y);
      const row = (data[modeKey][y][cat] || []).find(r=>r.id===id);
      if(row){
        if(!row.vals) row.vals = {};
        row.vals[m] = val;
        await save();
        render();
      }
    };
  });

  document.querySelectorAll('.det-remark-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const modeKey = inp.dataset.mode;
      const y = parseInt(inp.dataset.year);
      const cat = inp.dataset.cat;
      const id = inp.dataset.id;
      const val = inp.value.trim();

      if(!data[modeKey] || !data[modeKey][y]) return;
      const row = (data[modeKey][y][cat] || []).find(r=>r.id===id);
      if(row){
        row.remark = val;
        await save();
      }
    };
  });

  document.querySelectorAll('.rm-det-row').forEach(btn=>{
    btn.onclick = async ()=>{
      const modeKey = btn.dataset.mode;
      const y = parseInt(btn.dataset.year);
      const cat = btn.dataset.cat;
      const id = btn.dataset.id;
      if(!data[modeKey] || !data[modeKey][y]) return;
      showConfirmModal('이 항목을 삭제하시겠습니까?', async ()=>{
        data[modeKey][y][cat] = (data[modeKey][y][cat] || []).filter(r=>r.id!==id);
        await save();
        render();
      });
    };
  });

  const addNewDetRowBtn = document.getElementById('addNewDetRowBtn');
  if(addNewDetRowBtn){
    addNewDetRowBtn.onclick = ()=>{
      const isActual = (roadmapSubTab === 'annual-actual');
      const modeKey = isActual ? 'annualPlanActual' : 'annualPlan';
      const y = roadmapYear;
      
      const wrap = document.createElement('div');
      wrap.className = 'modal-bg';
      wrap.innerHTML = `
        <div class="modal">
          <h3 class="serif">머니플랜 항목 추가</h3>
          <div class="row">
            <label class="flabel">구분</label>
            <select id="newDetCat">
              <option value="incomeRows">수입 부문</option>
              <option value="expenseRows">지출 부문</option>
            </select>
          </div>
          <div class="row">
            <label class="flabel">항목명</label>
            <input id="newDetName" placeholder="예: 해외배당금, 특별상여금, 이사비용">
          </div>
          <div class="row">
            <label class="flabel">비고 (메모)</label>
            <input id="newDetRemark" placeholder="예: 분기별 수령, 양도세 납부용">
          </div>
          <div class="actions">
            <button class="cancel" id="det-cancel">취소</button>
            <button class="primary" id="det-save">추가하기</button>
          </div>
        </div>
      `;
      document.body.appendChild(wrap);
      document.getElementById('det-cancel').onclick = ()=> wrap.remove();
      wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };

      document.getElementById('det-save').onclick = async ()=>{
        const cat = document.getElementById('newDetCat').value;
        const name = document.getElementById('newDetName').value.trim();
        const remark = document.getElementById('newDetRemark').value.trim();
        if(!name){ showToast('항목명을 입력해주세요.', 'error'); return; }

        if(!data[modeKey]) data[modeKey] = {};
        if(!data[modeKey][y]) ensureDefaultDetailedAnnualPlan(y);
        if(!data[modeKey][y][cat]) data[modeKey][y][cat] = [];

        data[modeKey][y][cat].push({
          id: uid(),
          name,
          vals: {},
          remark
        });
        await save();
        wrap.remove();
        render();
        showToast('항목이 추가되었습니다.');
      };
    };
  }

  const resetToDefaultPlanBtn = document.getElementById('resetToDefaultPlanBtn');
  if(resetToDefaultPlanBtn){
    resetToDefaultPlanBtn.onclick = ()=>{
      showConfirmModal(`${roadmapYear}년 머니플랜을 구글 시트 원본 기본 데이터로 다시 복원하시겠습니까?`, async ()=>{
        delete data.annualPlan[roadmapYear];
        delete data.annualPlanActual[roadmapYear];
        ensureDefaultDetailedAnnualPlan(roadmapYear);
        await save();
        render();
        showToast('시트 원본 데이터로 복원되었습니다.');
      });
    };
  }

  const lrStartYear = document.getElementById('lr-startyear');
  if(lrStartYear) lrStartYear.onchange = async ()=>{
    ensureLongRoadmap();
    const v = parseInt(lrStartYear.value);
    if(!isNaN(v)){
      setRoadmapStartYear(v);
      autoSyncYearEndAsset(v);
    }
    await save(); render();
  };
  const lrStart = document.getElementById('lr-start');
  if(lrStart) lrStart.onchange = async ()=>{
    ensureLongRoadmap();
    data.longRoadmap.startingAsset = parseWon(lrStart.value);
    await save(); render();

  const lrBirthYear = document.getElementById('lr-birthyear');
  if(lrBirthYear) lrBirthYear.onchange = async ()=>{
    ensureLongRoadmap();
    const v = parseInt(lrBirthYear.value);
    data.longRoadmap.birthYear = isNaN(v) ? null : v;
    await save(); render();
  };
  const lrMomBirthYear = document.getElementById('lr-mom-birthyear');
  if(lrMomBirthYear) lrMomBirthYear.onchange = async ()=>{
    ensureLongRoadmap();
    const v = parseInt(lrMomBirthYear.value);

    await save(); render();
  };

  const syncFromAssetBtn = document.getElementById('syncFromAssetBtn');
  if(syncFromAssetBtn) syncFromAssetBtn.onclick = syncFromAssetTab;

  document.querySelectorAll('.ly-input').forEach(inp=>{
    inp.onchange = async ()=>{
      ensureLongRoadmap();
      const y = data.longRoadmap.years.find(x=>x.id===inp.dataset.id);
      if(!y) return;
      const field = inp.dataset.field;
      const numeric = ['savings','returnPct','realEstate'].includes(field);
      y[field] = numeric ? parseWonFloat(inp.value) : inp.value;
      await save();
    };
  });

  const addYearsBulkBtn = document.getElementById('addYearsBulkBtn');
  if(addYearsBulkBtn) addYearsBulkBtn.onclick = async ()=>{
    ensureLongRoadmap();
    const count = parseInt(document.getElementById('bulkYearsCount').value)||5;
    const years = data.longRoadmap.years;
    let lastYear = years.length ? years[years.length-1].year : new Date().getFullYear();
    for(let i=0;i<count;i++){
      lastYear++;
      years.push({id:uid(), year:lastYear, savings:50000000, returnPct:15, realEstate:0, lifePlan:'', growthPlan:'', visionImg:''});
    }
    await save(); render();
  };

  const addRmItem = document.getElementById('addRmItem');
  if(addRmItem) addRmItem.onclick = async ()=>{
    const nameInp = document.getElementById('newRmItem');
    const name = nameInp.value.trim();
    if(!name) return;
    const y = roadmapYear;
    if(!data.shortRoadmap[y]) data.shortRoadmap[y] = {items:[],plan:{},actual:{}};
    data.shortRoadmap[y].items.push({id:uid(), name});
    await save(); render();
  };
  document.querySelectorAll('.rm-item').forEach(b=>{
    b.onclick = async ()=>{
      const y = roadmapYear;
      const rm = data.shortRoadmap[y];
      rm.items = rm.items.filter(it=>it.id!==b.dataset.id);
      delete rm.plan[b.dataset.id]; delete rm.actual[b.dataset.id];
      await save(); render();
    };
  });
  document.querySelectorAll('.rm-item-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const y = roadmapYear;
      const rm = data.shortRoadmap[y];
      const store = rm[inp.dataset.kind];
      if(!store[inp.dataset.item]) store[inp.dataset.item] = {};
      store[inp.dataset.item][inp.dataset.month] = parseWon(inp.value);
      await save(); render();
    };
  });

  const assetPrev = document.getElementById('assetPrev');
  const assetNext = document.getElementById('assetNext');
  if(assetPrev) assetPrev.onclick = ()=>{ assetMonthRef.setMonth(assetMonthRef.getMonth()-1); render(); };
  if(assetNext) assetNext.onclick = ()=>{ assetMonthRef.setMonth(assetMonthRef.getMonth()+1); render(); };
  document.querySelectorAll('.asset-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const mk = monKey(assetMonthRef);
      if(!data.assetSnapshots[mk]) data.assetSnapshots[mk] = {};
      data.assetSnapshots[mk][inp.dataset.id] = parseWon(inp.value);
      await save(); render();
    };
  });
  document.querySelectorAll('.rm-asset').forEach(b=>{
    b.onclick = async ()=>{
      data.assetItems = data.assetItems.filter(i=>i.id!==b.dataset.id);
      await save(); render();
    };
  });
  const addAssetBtn = document.getElementById('addAssetBtn');
  if(addAssetBtn) addAssetBtn.onclick = async ()=>{
    const name = document.getElementById('newAssetName').value.trim();
    const group = document.getElementById('newAssetGroup').value;
    if(!name) return;
    data.assetItems.push({id:uid(), name, group});
    await save(); render();
  };
  const assetFb = document.getElementById('asset-fb');
  if(assetFb) assetFb.onblur = async ()=>{
    const mk = monKey(assetMonthRef);
    data.assetFeedback[mk] = assetFb.value;
    await save();
  };

  const prevWk = document.getElementById('prevWk');
  const nextWk = document.getElementById('nextWk');
  if(prevWk) prevWk.onclick = ()=>{ refDate.setDate(refDate.getDate()-7); render(); };
  if(nextWk) nextWk.onclick = ()=>{ refDate.setDate(refDate.getDate()+7); render(); };
  document.querySelectorAll('.addbtn').forEach(b=>{ b.onclick = ()=> openEntryModal(b.dataset.date); });
  document.querySelectorAll('.addbudgetbtn').forEach(b=>{ b.onclick = ()=> openAddBudgetModal(b.dataset.date); });
  document.querySelectorAll('.del-budget').forEach(b=>{
    b.onclick = async ()=>{
      const d = b.dataset.date, c = b.dataset.cid;
      if(data.dailyCategoryBudgets && data.dailyCategoryBudgets[d]) delete data.dailyCategoryBudgets[d][c];
      await save(); render();
      showToast('예산이 삭제되었습니다.');
    };
  });
  document.querySelectorAll('.fixedpay').forEach(b=>{
    b.onclick = ()=> openEntryModal(isoDate(new Date()), {presetCatId:b.dataset.cid});
  });
  document.querySelectorAll('.entry .edit').forEach(b=>{
    b.onclick = ()=> openEntryModal(null, {entry: (data.entries || []).find(e=>e.id===b.dataset.eid)});
  });
  document.querySelectorAll('.entry .del').forEach(b=>{
    b.onclick = ()=>{
      showConfirmModal('이 기록을 삭제하시겠습니까?', async ()=>{
        data.entries = (data.entries || []).filter(e=>e.id!==b.dataset.eid);
        await save(); render();
        showToast('기록이 삭제되었습니다.');
      });
    };
  });
  ['fb-total','fb-best','fb-worst','fb-next'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onblur = async ()=>{
      const {mon} = getWeekRange(refDate);
      const wk = weekKey(mon);
      if(!data.feedback[wk]) data.feedback[wk] = {total:'',worst:'',best:'',next:''};
      const map = {'fb-total':'total','fb-best':'best','fb-worst':'worst','fb-next':'next'};
      data.feedback[wk][map[id]] = el.value;
      await save();
    };
  });

  const monthPrev = document.getElementById('monthPrev');
  const monthNext = document.getElementById('monthNext');
  if(monthPrev) monthPrev.onclick = ()=>{ monthRef.setMonth(monthRef.getMonth()-1); render(); };
  if(monthNext) monthNext.onclick = ()=>{ monthRef.setMonth(monthRef.getMonth()+1); render(); };
  ['mfb-total','mfb-best','mfb-worst','mfb-next'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onblur = async ()=>{
      const mk = monKey(monthRef);
      if(!data.monthFeedback[mk]) data.monthFeedback[mk] = {total:'',worst:'',best:'',next:''};
      const map = {'mfb-total':'total','mfb-best':'best','mfb-worst':'worst','mfb-next':'next'};
      data.monthFeedback[mk][map[id]] = el.value;
      await save();
    };
  });

  const projPrev = document.getElementById('projPrev');
  const projNext = document.getElementById('projNext');
  if(projPrev) projPrev.onclick = ()=>{ projectMonthRef.setMonth(projectMonthRef.getMonth()-1); render(); };
  if(projNext) projNext.onclick = ()=>{ projectMonthRef.setMonth(projectMonthRef.getMonth()+1); render(); };
  
  document.querySelectorAll('[data-ptab]').forEach(b=>{
    b.onclick = ()=>{ projectSubTab = b.dataset.ptab; render(); };
  });

  // 새 프로젝트 카드 추가 핸들러
  const addNewProjectCardBtn = document.getElementById('addNewProjectCardBtn');
  if(addNewProjectCardBtn){
    addNewProjectCardBtn.onclick = async ()=>{
      const today = isoDate(new Date());
      const nextYear = new Date();
      nextYear.setFullYear(nextYear.getFullYear() + 1);
      const endStr = isoDate(nextYear);

      data.projects.unshift({
        id: uid(),
        code: '신규 프로젝트',
        nameKr: '신규 프로젝트',
        nameEn: '',
        principal: 10000000,
        startDate: today,
        endDate: endStr,
        rate1: '0.15',
        rate2: '',
        rate3: '',
        memo: '',
        includeInSummary: true,
        principalReturned: false
      });
      await save();
      render();
      showToast('새 프로젝트 카드가 추가되었습니다.');
    };
  }

  // 프로젝트 카드 인라인 텍스트 및 날짜 변경 핸들러
  document.querySelectorAll('.proj-input-text, .proj-input-date').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = (data.projects || []).find(x => x.id === inp.dataset.id);
      if(!p) return;
      const field = inp.dataset.field;
      p[field] = inp.value.trim();
      if(field === 'code') p.nameKr = p.code;
      await save();
      render();
    };
  });

  // 프로젝트 원금 인라인 변경 핸들러
  document.querySelectorAll('.proj-input-money').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = (data.projects || []).find(x => x.id === inp.dataset.id);
      if(!p) return;
      p.principal = parseWon(inp.value);
      await save();
      render();
    };
  });

  // 프로젝트 정산 포함 체크박스 핸들러
  document.querySelectorAll('.proj-input-chk').forEach(chk=>{
    chk.onchange = async ()=>{
      const p = (data.projects || []).find(x => x.id === chk.dataset.id);
      if(!p) return;
      p.includeInSummary = chk.checked;
      await save();
      render();
      showToast(chk.checked ? '정산 합계에 포함됩니다.' : '정산 합계에서 제외되었습니다.');
    };
  });

  // 프로젝트 삭제 버튼 핸들러
  document.querySelectorAll('.rm-project-card-btn').forEach(b=>{
    b.onclick = ()=>{
      showConfirmModal('이 프로젝트를 삭제하시겠습니까?', async ()=>{
        data.projects = (data.projects || []).filter(p=>p.id!==b.dataset.id);
        await save(); render();
        showToast('프로젝트가 삭제되었습니다.');
      });
    };
  });

  // 이자 수령 토글 함수
  async function toggleProjectInterest(pid){
    const mk = projectMonthRef.getFullYear()+'-'+String(projectMonthRef.getMonth()+1).padStart(2,'0');
    if(!data.projectReceipts[mk]) data.projectReceipts[mk] = {};
    const cur = data.projectReceipts[mk][pid] || {received:false};
    cur.received = !cur.received;
    data.projectReceipts[mk][pid] = cur;
    await save(); render();
    showToast(cur.received ? '이자 수령이 확인되어 월간/주간 소득에 반영되었습니다.' : '이자 수령이 취소되었습니다.');
  }

  // 만기 원금 회수 토글 함수
  async function toggleProjectPrincipal(pid){
    const p = (data.projects || []).find(x => x.id === pid);
    if(!p) return;
    p.principalReturned = !p.principalReturned;
    await save(); render();
    showToast(p.principalReturned ? `[${p.code||p.nameKr}] 만기 원금(${won(p.principal)}) 회수가 확인되었습니다.` : '원금 회수 처리가 취소되었습니다.');
  }

  // 버튼 및 칩 바인딩
  document.querySelectorAll('.proj-btn-interest').forEach(b=>{
    b.onclick = ()=> toggleProjectInterest(b.dataset.pid);
  });
  document.querySelectorAll('.proj-btn-principal').forEach(b=>{
    b.onclick = ()=> toggleProjectPrincipal(b.dataset.pid);
  });
  document.querySelectorAll('.projchip').forEach(c=>{
    c.onclick = ()=>{
      const action = c.dataset.action;
      if(action === 'toggle-principal'){
        toggleProjectPrincipal(c.dataset.pid);
      } else {
        toggleProjectInterest(c.dataset.pid);
      }
    };
  });

  // Search Logic (Only searches when triggered)
  const searchInput = document.getElementById('searchInput');
  const searchCatFilter = document.getElementById('searchCatFilter');
  const searchTypeFilter = document.getElementById('searchTypeFilter');

  function doSearch(){
    if(!searchInput) return;
    const q = searchInput.value.trim().toLowerCase();
    const catF = searchCatFilter ? searchCatFilter.value : '';
    const typeF = searchTypeFilter ? searchTypeFilter.value : '';

    const resultsEl = document.getElementById('searchResults');
    const summaryEl = document.getElementById('searchResultsSummary');
    if(!resultsEl) return;

    if(!q && !catF && !typeF){
      resultsEl.innerHTML = `
        <div style="text-align:center;padding:48px 16px;color:var(--ink-muted);font-size:13px;">
          🔍 검색창에 찾고 싶은 품목 이름이나 거래처를 입력해주세요.
        </div>
      `;
      if(summaryEl) summaryEl.style.display = 'none';
      return;
    }

    const matched = (data.entries || []).filter(e=>{
      const c = catById(e.categoryId);
      const matchesQ = !q || (e.item||'').toLowerCase().includes(q) || (c&&c.name.toLowerCase().includes(q));
      const matchesCat = !catF || e.categoryId === catF;
      const matchesType = !typeF || (c && c.type === typeF);
      return matchesQ && matchesCat && matchesType;
    });

    matched.sort((a,b)=> b.date.localeCompare(a.date));
    const totalSum = matched.reduce((s,e)=> s + e.amount, 0);

    if(summaryEl){
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `총 <b>${matched.length}건</b>의 내역이 검색되었습니다. (합계: <span style="color:var(--ink-primary);font-weight:700;">${won(totalSum)}</span>)`;
    }

    if(matched.length === 0){
      resultsEl.innerHTML = '<div style="color:var(--ink-muted);text-align:center;padding:32px 0;">일치하는 거래 내역이 없습니다.</div>';
      return;
    }

    resultsEl.innerHTML = matched.map(e=>{
      const c = catById(e.categoryId);
      const badgeBg = c?.type==='income'?'var(--amber-soft)':(c?.type==='saving'?'var(--indigo-soft)':'var(--emerald-soft)');
      const badgeColor = c?.type==='income'?'var(--amber)':(c?.type==='saving'?'var(--indigo)':'var(--emerald)');
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-bottom:1px solid var(--border-subtle);">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:11px;color:var(--ink-muted);">${e.date}</span>
            <span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:${badgeBg};color:${badgeColor};">${c?escapeHtml(c.name):'미분류'}</span>
            <span style="font-weight:500;">${escapeHtml(e.item||'-')}</span>
          </div>
          <span style="font-weight:700;font-size:13px;">${won(e.amount)}</span>
        </div>
      `;
    }).join('');
  }

  if(searchInput){
    searchInput.oninput = doSearch;
  }
  if(searchCatFilter){
    searchCatFilter.onchange = doSearch;
  }
  if(searchTypeFilter){
    searchTypeFilter.onchange = doSearch;
  }

  // Category & Budget Handlers with smart sync
  document.querySelectorAll('.cat-budget-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const c = catById(inp.dataset.cid);
      if(c){
        const newBudget = parseWon(inp.value);
        c.budget = newBudget;
        if((c.subtype||'variable')==='variable'){
          c.weeklyBudget = Math.round(newBudget / 4.345);
        }
        await save();
        render();
      }
    };
  });
  document.querySelectorAll('.cat-week-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const c = catById(inp.dataset.cid);
      if(c){
        c.weeklyBudget = parseWon(inp.value);
        await save();
        render();
      }
    };
  });
  document.querySelectorAll('.rm-cat').forEach(b=>{
    b.onclick = ()=>{
      showConfirmModal('카테고리를 삭제하시겠습니까? (이전 거래 내역은 유지됩니다)', async ()=>{
        data.categories = (data.categories || []).filter(c=>c.id!==b.dataset.cid);
        await save(); render();
      });
    };
  });
  const addCatBtn = document.getElementById('addCatBtn');
  if(addCatBtn) addCatBtn.onclick = async ()=>{
    const name = document.getElementById('newCatName').value.trim();
    const type = document.getElementById('newCatType').value;
    const subtype = document.getElementById('newCatSubtype').value;
    if(!name) return;
    data.categories.push({id:uid(), name, type, subtype, budget:0});
    await save(); render();
    showToast('카테고리가 추가되었습니다.');
  };

  const exportBackupBtn = document.getElementById('exportBackupBtn');
  if(exportBackupBtn) exportBackupBtn.onclick = exportBackup;
  const importBackupBtn = document.getElementById('importBackupBtn');
  const importFileInput = document.getElementById('importFileInput');
  if(importBackupBtn && importFileInput){
    importBackupBtn.onclick = ()=> importFileInput.click();
    importFileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(file) importBackup(file);
      importFileInput.value = '';
    };
  }
}

function initMoneyInputFormatting(){
  document.addEventListener('input', (e)=>{
    const el = e.target;
    if(!el || !el.classList || !el.classList.contains('money-input')) return;
    const before = el.value;
    const caretFromEnd = before.length - (el.selectionStart==null?before.length:el.selectionStart);
    const formatted = formatMoneyInputValue(before);
    if(formatted !== before){
      el.value = formatted;
      const pos = Math.max(0, formatted.length - caretFromEnd);
      try{ el.setSelectionRange(pos, pos); }catch(err){}
    }
  });
}

async function startApp(){
  initMoneyInputFormatting();
  try{
    if(auth){
      if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token){
        const cred = await signInWithCustomToken(auth, __initial_auth_token);
        currentUser = cred.user;
      } else {
        const cred = await signInAnonymously(auth);
        currentUser = cred.user;
      }
    }
  }catch(e1){
    try{
      if(auth){
        const cred = await signInAnonymously(auth);
        currentUser = cred.user;
      }
    }catch(e2){
      console.warn('Auth initialization fallback mode active:', e2);
    }
  }
  setupRealtimeSync();
}

window.addEventListener('DOMContentLoaded', startApp);
if(document.readyState === 'complete' || document.readyState === 'interactive'){
  startApp();
}
</script>
</body>
</html>
